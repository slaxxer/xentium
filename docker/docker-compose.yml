services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nodevo
      POSTGRES_PASSWORD: nodevo
      POSTGRES_DB: nodevo
    ports: ["5432:5432"]
    volumes: ["nodevo_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  nodevo_pg:
