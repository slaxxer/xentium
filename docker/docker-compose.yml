name: xentium

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xentium
      POSTGRES_PASSWORD: xentium
      POSTGRES_DB: xentium
    ports: ["5432:5432"]
    volumes: ["xentium_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xentium"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["xentium_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xentium_pg:
  xentium_redis:
