name: nodevo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodevo
      POSTGRES_PASSWORD: nodevo
      POSTGRES_DB: nodevo
    ports: ["5432:5432"]
    volumes: ["nodevo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodevo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["nodevo_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nodevo_pg:
  nodevo_redis:
